# VOP local stack — the whole system runs offline. Infra services always start; the app
# services (api, web) are under the "app" profile so you can run them in-container OR run
# `pnpm dev` on the host against the infra here.
#
#   docker compose -f infra/docker/docker-compose.yml up -d           # infra only
#   docker compose -f infra/docker/docker-compose.yml --profile app up -d --build
#
# All credentials here are local-dev placeholders — never used in any real environment.

name: vop

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vop
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: vop
    ports: ['5432:5432']
    volumes: ['pgdata:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vop -d vop']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports: ['6379:6379']
    volumes: ['redisdata:/data']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ['9000:9000', '9001:9001']
    volumes: ['miniodata:/data']
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10

  minio-setup:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/vop-documents &&
      mc anonymous set none local/vop-documents &&
      echo 'bucket ready';
      "
    restart: 'no'

  clamav:
    image: clamav/clamav:latest
    ports: ['3310:3310']
    volumes: ['clamavdb:/var/lib/clamav']
    healthcheck:
      test: ['CMD-SHELL', 'echo PING | nc -w 5 localhost 3310 | grep -q PONG']
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

  mailpit:
    image: axllent/mailpit:latest
    ports: ['1025:1025', '8025:8025']
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 'true'
      MP_SMTP_AUTH_ALLOW_INSECURE: 'true'

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    command: ['start-dev', '--import-realm']
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: 'true'
    ports: ['8080:8080']
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          "exec 3<>/dev/tcp/localhost/8080; echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; cat <&3 | grep -q '200 OK'",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s

  vault:
    image: hashicorp/vault:1.17
    cap_add: ['IPC_LOCK']
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: changeme
      VAULT_DEV_LISTEN_ADDRESS: '0.0.0.0:8200'
    ports: ['8200:8200']

  api:
    profiles: ['app']
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
    environment:
      NODE_ENV: development
      VOP_API_PORT: '3000'
      DATABASE_URL: postgresql://vop:changeme@postgres:5432/vop?schema=public
      REDIS_URL: redis://redis:6379
      VOP_STORAGE_DRIVER: minio
      VOP_STORAGE_ENDPOINT: http://minio:9000
      VOP_STORAGE_BUCKET: vop-documents
      VOP_STORAGE_ACCESS_KEY: minioadmin
      VOP_STORAGE_SECRET_KEY: minioadmin
      VOP_SECRETS_DRIVER: vault
      VOP_VAULT_ADDR: http://vault:8200
      VOP_VAULT_TOKEN: changeme
      VOP_EMAIL_DRIVER: smtp
      VOP_SMTP_HOST: mailpit
      VOP_SMTP_PORT: '1025'
      VOP_SCAN_DRIVER: clamav
      VOP_CLAMAV_HOST: clamav
      VOP_KEY_DRIVER: local
      VOP_MASTER_KEY: dev-master-key-change-me
      VOP_BLIND_INDEX_KEY: dev-blind-index-key-change-me
      VOP_OIDC_ISSUER: http://keycloak:8080/realms/vop
      VOP_OIDC_CLIENT_ID: vop-api
      VOP_OIDC_CLIENT_SECRET: changeme
      VOP_CORS_ORIGINS: http://localhost:3001
    ports: ['3000:3000']
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
      keycloak: { condition: service_healthy }

  web:
    profiles: ['app']
    build:
      context: ../..
      dockerfile: infra/docker/web.Dockerfile
    environment:
      NODE_ENV: development
      VOP_API_URL: http://api:3000
    ports: ['3001:3001']
    depends_on:
      api: { condition: service_started }

volumes:
  pgdata:
  redisdata:
  miniodata:
  clamavdb:
